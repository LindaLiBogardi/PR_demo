name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Testkör pipelinen på sparad exempeldata
        run: python run_pipeline.py --input tests/exempel.json --output /tmp/resultat.csv